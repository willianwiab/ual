name: Atualizar notícias

on:
  schedule:
    # A cada 3 horas, das 6h às 21h em São Paulo (UTC-3). O agendador do GitHub às vezes
    # atrasa ou pula um horário; com vários horários, a capa nunca fica muito tempo parada.
    - cron: "17 9,12,15,18,21,0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/coletar.py
      - name: Salvar os arquivos de dados
        run: |
          git config user.name "ual-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json cinema.json time.json igreja.json
          git diff --cached --quiet && echo "nada novo" && exit 0
          git commit -m "Notícias $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
          git push
